name: Release

# Rilis artefak: sender .dmg (macOS) + .exe (Windows NSIS) + receiver .apk (Android).
# Dipicu oleh tag `v*` atau manual (workflow_dispatch, wajib isi `tag`).
# Artefak awal UNSIGNED/adhoc — lihat RELEASE.md untuk catatan signing.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag rilis (mis. v0.1.0). Wajib untuk dispatch manual."
        required: true
        type: string

# Least privilege: only the `publish` job needs write access (it creates the
# GitHub Release). All build jobs are read-only. This workflow only runs on
# `v*` tags and manual dispatch; tag creation is restricted to the maintainer
# via a repository ruleset.
permissions:
  contents: write

env:
  NODE_VERSION: "22"

jobs:
  # ---------- macOS: .dmg universal (arm64 + x86_64) ----------
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: sender-app/src-tauri
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: sender-app/package-lock.json
      - name: Install frontend deps
        working-directory: sender-app
        run: npm ci
      - name: Build .dmg (universal)
        working-directory: sender-app
        run: npx tauri build --target universal-apple-darwin --bundles dmg
      - name: Collect dmg
        run: |
          set -euo pipefail
          mkdir -p dist-release
          DMG="$(find . -path '*release/bundle/dmg/*.dmg' -not -path './node_modules/*' | head -1)"
          echo "dmg: $DMG"
          test -n "$DMG"
          cp "$DMG" "dist-release/wdt-sender-${TAG}-macos-universal.dmg"
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-dmg
          path: dist-release/*.dmg
          if-no-files-found: error

  # ---------- Windows: installer NSIS (.exe) ----------
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: sender-app/src-tauri
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: sender-app/package-lock.json
      - name: Install frontend deps
        working-directory: sender-app
        run: npm ci
      - name: Build NSIS installer
        working-directory: sender-app
        run: npx tauri build --bundles nsis
      - name: Collect exe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-release
          EXE="$(find . -path '*release/bundle/nsis/*.exe' -not -path './node_modules/*' | head -1)"
          echo "exe: $EXE"
          test -n "$EXE"
          cp "$EXE" "dist-release/wdt-sender-${TAG}-windows-x64-setup.exe"
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-exe
          path: dist-release/*.exe
          if-no-files-found: error

  # ---------- Android: APK (debug-sign sehingga dapat dipasang) ----------
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" \
              -path '*/cmdline-tools/*/bin/sdkmanager' 2>/dev/null | head -1)"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
      - name: Build APK
        working-directory: receiver-app
        run: ./gradlew --no-daemon assembleDebug
      - name: Collect apk
        run: |
          set -euo pipefail
          mkdir -p dist-release
          APK="$(find . -path '*outputs/apk/debug/*.apk' -not -path './node_modules/*' | head -1)"
          echo "apk: $APK"
          test -n "$APK"
          cp "$APK" "dist-release/wdt-receiver-${TAG}-android.apk"
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-apk
          path: dist-release/*.apk
          if-no-files-found: error

  # ---------- Publish: satu GitHub Release berisi ketiga artefak ----------
  publish:
    needs: [macos, windows, android]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true
      - name: List artifacts
        run: ls -la artifacts
      - name: Create/update GitHub Release
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
          else
            gh release create "$TAG" artifacts/* \
              --title "Wireless Display Tool $TAG" \
              --generate-notes
          fi

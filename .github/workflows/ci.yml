name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".gitignore"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
  # PRs always run all jobs (no paths-ignore): `macos`, `windows`, and
  # `android` are required status checks on `main`, so they must exist for
  # every PR, including docs-only ones. The repo is public, so Actions
  # minutes are free.
  pull_request:
  workflow_dispatch:

# Least privilege: PR workflows get read-only access by default.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # macOS: build + test penuh (termasuk sender-app/Tauri).
  macos:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sender-app/package-lock.json
      # tauri::generate_context!() memerlukan dist frontend ada saat compile.
      - name: Build frontend
        working-directory: sender-app
        run: npm ci && npm run build && npm run i18n:check
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Test workspace
        run: cargo test --workspace

  # Windows: validasi kode core spesifik-Windows (kompilasi + unit test).
  # TIDAK membangun sender-app (butuh dist + WebView2); core memuat seluruh
  # kode platform-Windows (capture/encode/audio/vdisplay).
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Test core
        run: cargo test -p wdt-core

  # Android receiver: unit test + lint + assemble (tanpa device).
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      # Runner ubuntu sudah menyediakan Android SDK + sdkmanager; cukup terima
      # lisensi lalu biarkan Gradle mengunduh platform 34 yang dibutuhkan.
      # (Sebelumnya memakai android-actions/setup-android@v3 yang gagal install
      # paket 'tools' legacy.)
      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" \
              -path '*/cmdline-tools/*/bin/sdkmanager' 2>/dev/null | head -1)"
          fi
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
      - name: Cek paritas lokalisasi (ID/EN)
        run: python3 receiver-app/scripts/check_i18n.py
      - name: Gradle test/lint/assemble
        working-directory: receiver-app
        run: ./gradlew --no-daemon testDebugUnitTest lint assembleDebug

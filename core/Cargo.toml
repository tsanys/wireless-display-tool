[package]
name = "wdt-core"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["ws"] }
bytes = "1.12.1"
fastrand = "2.5.0"
futures-util = "0.3.34"
mdns-sd = "0.21.4"
# Encoder Opus. `opusic-sys` meng-compile libopus (C) via cmake saat build
# lalu static-link — TIDAK ada DLL native saat runtime, aplikasi tetap
# portabel; cmake hanyalah kebutuhan build-time (sama seperti rustc).
opus = "0.4"
# Resampler PCM pure-Rust (tanpa C), untuk normalisasi jalur Windows
# (mix format WASAPI bisa 44,1 kHz). macOS meminta 48 kHz langsung dari SCK.
rubato = "5.0"
rtc = "0.20"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = "0.30.0"
tracing = "0.1.44"
webrtc = "0.21"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = [
    "Graphics_Capture",
    "Foundation",
    "Foundation_Collections",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_Media_MediaFoundation",
] }
windows-capture = "2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
core-graphics = "0.25.0"
dispatch2 = "0.3"
objc2 = "0.6.4"
objc2-core-audio-types = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-core-media = "0.3"
objc2-core-video = "0.3"
objc2-foundation = "0.3"
objc2-screen-capture-kit = { version = "0.3", features = ["block2", "objc2-core-graphics", "objc2-core-foundation"] }
objc2-video-toolbox = { version = "0.3", features = ["VTCompressionSession", "VTCompressionProperties", "VTErrors", "VTSession", "objc2-core-media", "objc2-core-video"] }

[dev-dependencies]
image = "0.25.10"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

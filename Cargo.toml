[workspace]
resolver = "2"
members = [
    "core",
    "sender-app/src-tauri",
]

# Pipeline capture/encode/downscale berjalan di thread sendiri dan CPU-bound;
# pada build `dev` (tauri dev) opt-level 0 membuatnya jauh di bawah 30 fps.
# Optimalkan crate wdt-core saja agar dev tetap ringan di-build.
[profile.dev.package.wdt-core]
opt-level = 2

# Dipindah dari sender-app/src-tauri: profile hanya berlaku di workspace root.
# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

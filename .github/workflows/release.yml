name: Release

# Rilis artefak: sender .dmg (macOS) + .exe (Windows NSIS) + receiver .apk (Android).
# Dipicu oleh tag `v*` atau manual (workflow_dispatch, wajib isi `tag`).
# Artefak awal UNSIGNED/adhoc — lihat RELEASE.md untuk catatan signing.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag rilis (mis. v0.1.0). Wajib untuk dispatch manual."
        required: true
        type: string

permissions:
  contents: write

env:
  NODE_VERSION: "22"

jobs:
  # ---------- macOS: .dmg universal (arm64 + x86_64) ----------
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sender-app/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: sender-app/package-lock.json
      - name: Install frontend deps
        working-directory: sender-app
        run: npm ci
      - name: Build .dmg (universal)
        working-directory: sender-app
        run: npx tauri build --target universal-apple-darwin --bundles dmg
      - name: Collect dmg
        run: |
          mkdir -p dist-release
          cp sender-app/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg \
            "dist-release/wdt-sender-${TAG}-macos-universal.dmg"
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist-release/*.dmg
          if-no-files-found: error

  # ---------- Windows: installer NSIS (.exe) ----------
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sender-app/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: sender-app/package-lock.json
      - name: Install frontend deps
        working-directory: sender-app
        run: npm ci
      - name: Build NSIS installer
        working-directory: sender-app
        run: npx tauri build --bundles nsis
      - name: Collect exe
        shell: bash
        run: |
          mkdir -p dist-release
          cp sender-app/src-tauri/target/release/bundle/nsis/*.exe \
            "dist-release/wdt-sender-${TAG}-windows-x64-setup.exe"
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist-release/*.exe
          if-no-files-found: error

  # ---------- Android: APK (debug-sign sehingga dapat dipasang) ----------
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" \
              -path '*/cmdline-tools/*/bin/sdkmanager' 2>/dev/null | head -1)"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
      - name: Build APK
        working-directory: receiver-app
        run: ./gradlew --no-daemon assembleDebug
      - name: Collect apk
        run: |
          mkdir -p dist-release
          cp receiver-app/app/build/outputs/apk/debug/app-debug.apk \
            "dist-release/wdt-receiver-${TAG}-android.apk"
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist-release/*.apk
          if-no-files-found: error

  # ---------- Publish: satu GitHub Release berisi ketiga artefak ----------
  publish:
    needs: [macos, windows, android]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: List artifacts
        run: ls -la artifacts
      - name: Create/update GitHub Release
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
          else
            gh release create "$TAG" artifacts/* \
              --title "Wireless Display Tool $TAG" \
              --generate-notes
          fi
